name: Android
on: [push, pull_request]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory-app-port
          fetch-depth: 0
      - name: Import complete Memory App upstream
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[memory-imported]')
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          curl -L --fail "https://github.com/TadhaKM/Memory-App/archive/refs/heads/claude/review-project-status-p0L5P.tar.gz" -o "$tmp/src.tgz"
          mkdir "$tmp/src"
          tar -xzf "$tmp/src.tgz" -C "$tmp/src" --strip-components=1
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$tmp/src/." .
          mkdir -p .github/workflows
          cp .github/workflows/android.yml "$tmp/android.yml"
          find .github/workflows -type f ! -name android.yml -delete
          cp "$tmp/android.yml" .github/workflows/android.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import complete Memory App source [memory-imported]"
          git push origin HEAD:memory-app-port
      - uses: actions/setup-java@v4
        if: contains(github.event.head_commit.message, '[memory-imported]')
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        if: contains(github.event.head_commit.message, '[memory-imported]')
      - name: Build imported Memory App
        if: contains(github.event.head_commit.message, '[memory-imported]')
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          ANTHROPIC_API_KEY: ""
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: contains(github.event.head_commit.message, '[memory-imported]')
        with:
          name: MemoryApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
