name: Import Memory App
on:
  push:
    branches: [memory-app-port]
    paths: [.github/workflows/import-memory.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory-app-port
          fetch-depth: 0
      - name: Import upstream Memory App source
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          curl -L --fail "https://github.com/TadhaKM/Memory-App/archive/refs/heads/claude/review-project-status-p0L5P.tar.gz" -o "$tmp/src.tgz"
          mkdir "$tmp/src"
          tar -xzf "$tmp/src.tgz" -C "$tmp/src" --strip-components=1
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$tmp/src/." .
          mkdir -p .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import complete Memory App source into isolated branch"
          git push origin HEAD:memory-app-port
